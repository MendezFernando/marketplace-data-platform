[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-dp"
version = "0.1.0"
description = "Plataforma de datos end-to-end para un marketplace de e-commerce"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Fernando Mendez", email = "mendez.fernando.fml@gmail.com" }]

dependencies = [
    # ─── Procesamiento de datos ──────────────────────────────────────────
    "pandas>=2.2,<3.0",
    "pyarrow>=16.0",            # motor de Parquet
    # ─── Almacenamiento de objetos (MinIO / S3) ──────────────────────────
    "boto3>=1.34",              # cliente S3 oficial
    "s3fs>=2024.6",             # permite leer/escribir rutas s3:// desde pandas y pyarrow
    # ─── Configuración y contratos de datos ──────────────────────────────
    "pydantic>=2.7",            # validación y contratos de esquema
    "pydantic-settings>=2.3",   # configuración tipada desde variables de entorno
    "python-dotenv>=1.0",
    # ─── Observabilidad ──────────────────────────────────────────────────
    "structlog>=24.1",          # logging estructurado (JSON)
    # ─── Clientes de fuentes ─────────────────────────────────────────────
    "httpx>=0.27",              # cliente HTTP moderno, con reintentos y timeouts
    # ─── Procesamiento distribuido (Bronze → Silver) ─────────────────────
    # Versiones acopladas: delta-spark 3.x requiere Spark 3.5.x.
    "pyspark>=3.5,<4.0",
    "delta-spark>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",                # linter + formateador (reemplaza flake8, isort y black)
    "mypy>=1.10",
    "ipykernel>=6.29",          # para notebooks de exploración
]

[tool.setuptools.packages.find]
where = ["src"]

# ═══════════════════════════════════════════════════════════════════════════
#  Ruff — linter y formateador
# ═══════════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — errores reales
    "I",        # isort — orden de imports
    "N",        # pep8-naming
    "UP",       # pyupgrade — sintaxis moderna
    "B",        # flake8-bugbear — bugs probables
    "C4",       # comprehensions
    "SIM",      # simplificaciones
    "PTH",      # usar pathlib en vez de os.path
    "RET",      # returns innecesarios
    "ARG",      # argumentos sin usar
]
ignore = ["E501",    # la longitud de línea la gestiona el formateador
          "N812",    # PySpark usa la convención functions as F
          "SIM112"] # Variables de Hadoop/JVM deben mantener su formato original

# ═══════════════════════════════════════════════════════════════════════════
#  Pytest
# ═══════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "integration: pruebas que requieren servicios externos (docker compose up)",
]

# ═══════════════════════════════════════════════════════════════════════════
#  Mypy
# ═══════════════════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
