# Integración continua: cada push y cada Pull Request se verifican solos.
#
# Lo que corre aquí es exactamente lo que correrías en tu máquina antes de
# subir código. La diferencia es que aquí no se puede olvidar.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Spark corre sobre la JVM: sin Java, las pruebas ni siquiera arrancan.
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # El linter primero: falla en segundos y evita gastar minutos de CI
      # ejecutando pruebas sobre código que ni siquiera cumple el estilo.
      - name: Revisar estilo (ruff)
        run: ruff check src tests

      - name: Revisar formato (ruff)
        run: ruff format --check src tests

      # Las variables no son secretos reales: las pruebas unitarias no tocan
      # ni S3 ni PostgreSQL. Existen solo porque la configuración se valida al
      # importarse, y sin ellas el import fallaría.
      - name: Ejecutar pruebas unitarias
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          BUCKET_BRONZE: bronze
          BUCKET_SILVER: silver
          BUCKET_GOLD: gold
          POSTGRES_HOST: localhost
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: pytest tests/unit -v --cov=marketplace_dp --cov-report=term-missing
