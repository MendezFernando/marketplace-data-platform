# ═══════════════════════════════════════════════════════════════════════════
#  Plataforma de datos del marketplace — servicios base
#
#  Levantar:   docker compose up -d
#  Estado:     docker compose ps
#  Logs:       docker compose logs -f <servicio>
#  Apagar:     docker compose down          (conserva los volúmenes)
#  Borrar TODO: docker compose down -v      (⚠️ elimina los datos)
# ═══════════════════════════════════════════════════════════════════════════

name: marketplace-dp

services:

  # ─────────────────────────────────────────────────────────────────────────
  #  PostgreSQL — Data Warehouse (capa de servicio para Gold)
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Fuerza autenticación por contraseña también en conexiones locales
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Todo .sql o .sh en este directorio se ejecuta UNA VEZ, cuando el volumen
      # se crea vacío. Aquí se aprovecha para crear la base de metadatos que
      # Airflow necesita, en la misma instancia y sin un contenedor extra.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dataplatform

  # ─────────────────────────────────────────────────────────────────────────
  #  MinIO — Data Lake (almacenamiento de objetos compatible con S3)
  # ─────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: mdp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API S3   — lo consumen Spark, Python, dbt
      - "9001:9001"   # Consola web — para humanos
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dataplatform

  # ─────────────────────────────────────────────────────────────────────────
  #  minio-init — contenedor efímero: crea los buckets del medallón y termina
  # ─────────────────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: mdp-minio-init
    depends_on:
      minio:
        condition: service_healthy      # espera al healthcheck, no al arranque
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_BRONZE} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_SILVER} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_GOLD} &&
      mc version enable local/$${MINIO_BUCKET_BRONZE} &&
      echo '--- buckets del medallon listos ---' &&
      mc ls local
      "
    networks:
      - dataplatform

  # ─────────────────────────────────────────────────────────────────────────
  #  Airflow — orquestación
  #
  #  Se usa LocalExecutor: el scheduler ejecuta las tareas en procesos hijos de
  #  su propio contenedor. Es la opción correcta para una sola máquina y evita
  #  los tres servicios extra que exige CeleryExecutor (workers, Redis, flower).
  # ─────────────────────────────────────────────────────────────────────────

  airflow-init:
    # Contenedor efímero: prepara la base de metadatos y el usuario, y termina.
    # Es el mismo patrón de `minio-init` que ya usas para crear los buckets.
    build: &airflow_build
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: mdp-airflow:latest
    container_name: mdp-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment: &airflow_env
      # ─── LAS DOS VARIABLES QUE CAMBIAN POR VIVIR DENTRO DE LA RED ────────
      # El resto (usuario, contraseña, buckets) se hereda del .env sin tocar.
      # Desde un contenedor, "localhost" es el propio contenedor: hay que usar
      # el nombre del servicio, que Docker resuelve por DNS interno.
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
      # Spark corre dentro de este contenedor; el JDK viene de la imagen.
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      # 2 GB en lugar de 4: Airflow y Spark comparten el presupuesto de Docker.
      SPARK_DRIVER_MEMORY: 2g
      # ─── Configuración propia de Airflow ─────────────────────────────────
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Sin ejemplos: los DAGs de muestra ensucian la interfaz.
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Cada cuánto relee la carpeta de DAGs buscando cambios.
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: /opt/project/src
    volumes: &airflow_volumes
      # El código se monta, no se copia: editas en Windows y el contenedor lo ve
      # al instante, sin reconstruir la imagen.
      - ./dags:/opt/airflow/dags
      - ./src:/opt/project/src
      - ./dbt:/opt/project/dbt
      - ./scripts:/opt/project/scripts
      - ./data:/opt/project/data
      - airflow_logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin           --firstname Fernando --lastname Mendez --role Admin           --email ${POSTGRES_USER}@local || true
        echo "--- airflow inicializado ---"
    networks:
      - dataplatform

  airflow-scheduler:
    build: *airflow_build
    image: mdp-airflow:latest
    container_name: mdp-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment: *airflow_env
    volumes: *airflow_volumes
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dataplatform

  airflow-webserver:
    build: *airflow_build
    image: mdp-airflow:latest
    container_name: mdp-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment: *airflow_env
    volumes: *airflow_volumes
    ports:
      # 8080 dentro del contenedor -> 8080 en tu Windows.
      # Este mapeo existe SOLO para que abras la interfaz en el navegador.
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dataplatform

  # ─────────────────────────────────────────────────────────────────────────
  #  Redpanda — bus de eventos compatible con la API de Kafka
  #
  #  Se usa Redpanda y no Apache Kafka por una razón práctica: Kafka necesita
  #  dos procesos (broker + coordinación) y mucha más memoria. Redpanda es un
  #  solo binario, arranca en segundos y habla EXACTAMENTE el mismo protocolo,
  #  así que el código (productor, consumidor, Spark) no distingue uno de otro.
  #  En producción encontrarás Kafka, MSK, Confluent o Event Hubs: el cliente
  #  que escribas aquí funciona contra todos ellos.
  # ─────────────────────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: mdp-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1                      # 1 núcleo: suficiente para aprender
      - --memory 1G
      - --overprovisioned            # modo "comparto la máquina con otros"
      - --node-id 0
      - --check=false
      # Dos direcciones para el MISMO broker:
      #   internal -> lo que usan otros contenedores (Airflow, Spark en Docker)
      #   external -> lo que usas tú desde Windows, en localhost:19092
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # API de Kafka para tu máquina
      - "9644:9644"     # métricas y administración
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - dataplatform

  # ─────────────────────────────────────────────────────────────────────────
  #  Consola web: ver topics, mensajes y grupos de consumo sin adivinar
  # ─────────────────────────────────────────────────────────────────────────
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: mdp-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"   # 8080 ya lo usa Airflow, así que se expone en 8081
    networks:
      - dataplatform


# ═══════════════════════════════════════════════════════════════════════════
#  Volúmenes — sobreviven a `docker compose down`. Aquí viven los datos.
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    name: mdp-postgres-data
  minio_data:
    name: mdp-minio-data
  airflow_logs:
    name: mdp-airflow-logs
  redpanda_data:
    name: mdp-redpanda-data

# ═══════════════════════════════════════════════════════════════════════════
#  Red privada — los servicios se resuelven entre sí por su nombre
#  (p. ej. Spark se conecta a "http://minio:9000", no a una IP)
# ═══════════════════════════════════════════════════════════════════════════
networks:
  dataplatform:
    name: mdp-network
    driver: bridge
